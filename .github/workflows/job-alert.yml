name: Internship Board Watcher

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:          # lets you trigger it manually to test

permissions:
  contents: write

concurrency:
  group: internship-watcher
  cancel-in-progress: false

jobs:
  check-boards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Fetch latest versions of both boards
        run: |
          mkdir -p snapshots
          curl -s https://raw.githubusercontent.com/SimplifyJobs/Summer2026-Internships/dev/README.md -o current-main.md
          curl -s https://raw.githubusercontent.com/SimplifyJobs/Summer2026-Internships/dev/README-Off-Season.md -o current-offseason.md

      - name: Parse boards and build email
        id: parse
        run: python3 .github/workflow-scripts/parse_boards.py

      - name: Send email if new rows found
        if: steps.parse.outputs.total != '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.parse.outputs.subject }}
          to: ${{ secrets.MAIL_TO }}
          from: Internship Watcher
          html_body: ${{ steps.parse.outputs.html_body }}
          body: ${{ steps.parse.outputs.plain_body }}

      - name: Save new snapshots for next run
        run: |
          cp current-main.md snapshots/previous-main.md
          cp current-offseason.md snapshots/previous-offseason.md

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add snapshots/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update board snapshots"
          git pull --rebase origin main
          git push
