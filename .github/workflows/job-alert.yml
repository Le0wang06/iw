name: Internship Board Watcher

on:
  # Hourly backup. cron-job.org is the fast path (every 2 min via repository_dispatch).
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [iw-cron-boards]

permissions:
  contents: write
  issues: write

# One run at a time. Extra pings wait; older pending runs are dropped.
concurrency:
  group: internship-watcher
  cancel-in-progress: false

jobs:
  check-boards:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MAIL_TO: ${{ secrets.MAIL_TO }}
      ENABLE_EMAIL: ${{ vars.ENABLE_EMAIL }}
      ENABLE_GITHUB_ISSUES: ${{ vars.ENABLE_GITHUB_ISSUES }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Fetch latest versions of every board
        run: python3 .github/workflow-scripts/fetch_boards.py

      - name: Parse boards and build email
        id: parse
        run: python3 .github/workflow-scripts/parse_boards.py

      - name: Open GitHub issue if new rows found
        if: ${{ steps.parse.outputs.total != '0' && env.ENABLE_GITHUB_ISSUES == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ steps.parse.outputs.subject }}
        run: |
          gh issue create --title "$ISSUE_TITLE" --body-file alert.md --label "new-listing"

      - name: Ping Discord if new rows found
        id: discord
        if: ${{ steps.parse.outputs.total != '0' }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 .github/workflow-scripts/discord_notify.py

      - name: Send email if new rows found
        if: ${{ steps.parse.outputs.total != '0' && env.ENABLE_EMAIL == 'true' && env.MAIL_TO != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.parse.outputs.subject }}
          to: ${{ secrets.MAIL_TO }}
          from: Internship Watcher
          html_body: ${{ steps.parse.outputs.html_body }}
          body: ${{ steps.parse.outputs.plain_body }}

      - name: Commit seen-state only
        if: ${{ steps.parse.outputs.total == '0' || steps.discord.outcome == 'success' }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add snapshots/seen.json snapshots/watch-version.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update board seen state"
          git pull --rebase origin main
          git push
