name: Internship Board Watcher

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (GitHub's fastest schedule)
  workflow_dispatch:
  repository_dispatch:
    types: [iw-cron-boards]

permissions:
  contents: write
  issues: write

concurrency:
  group: internship-watcher
  cancel-in-progress: false

jobs:
  check-boards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Fetch latest versions of every board
        run: |
          mkdir -p snapshots
          curl -fsSL https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/README.md -o current-summer.md
          curl -fsSL https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/README-Off-Season.md -o current-offseason.md
          curl -fsSL https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/README.md -o current-newgrad.md \
            || curl -fsSL https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/main/README.md -o current-newgrad.md \
            || echo "" > current-newgrad.md
          curl -fsSL https://raw.githubusercontent.com/vanshb03/Summer2027-Internships/dev/README.md -o current-vansh.md \
            || echo "" > current-vansh.md
          curl -fsSL https://raw.githubusercontent.com/vanshb03/Summer2027-Internships/dev/OFFSEASON_README.md -o current-vansh-off.md \
            || echo "" > current-vansh-off.md
          curl -fsSL https://raw.githubusercontent.com/ApplyGuy/2027-Internships/main/data/internships.json -o current-applyguy.json \
            || echo '{"jobs":[]}' > current-applyguy.json
          curl -fsSL https://raw.githubusercontent.com/vanshb03/New-Grad-2027/dev/README.md -o current-vansh-ng.md \
            || curl -fsSL https://raw.githubusercontent.com/cvrve/New-Grad/dev/README.md -o current-vansh-ng.md \
            || echo "" > current-vansh-ng.md
          curl -fsSL https://zshah101.github.io/Automated-List-Of-Summer-2027-and-Fall-2026-Tech-Internships/api/jobs.json -o current-zshah.json \
            || echo '{"jobs":[]}' > current-zshah.json
          curl -fsSL https://ambicuity.github.io/New-Grad-Jobs/jobs.json -o current-ambicuity.json \
            || echo '{"jobs":[]}' > current-ambicuity.json
          curl -fsSL https://raw.githubusercontent.com/speedyapply/2027-SWE-College-Jobs/main/README.md -o current-speedy-swe.md \
            || echo "" > current-speedy-swe.md
          curl -fsSL https://raw.githubusercontent.com/speedyapply/2027-AI-College-Jobs/main/README.md -o current-speedy-ai.md \
            || echo "" > current-speedy-ai.md
          curl -fsSL https://raw.githubusercontent.com/aprameyak/2027-tech-jobs/main/README.md -o current-aprameyak.md \
            || echo "" > current-aprameyak.md

      - name: Parse boards and build email
        id: parse
        run: python3 .github/workflow-scripts/parse_boards.py

      - name: Open GitHub issue if new rows found
        if: ${{ steps.parse.outputs.total != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ steps.parse.outputs.subject }}
        run: |
          gh issue create --title "$ISSUE_TITLE" --body-file alert.md --label "new-listing"

      - name: Ping Discord if new rows found
        if: ${{ steps.parse.outputs.total != '0' }}
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 .github/workflow-scripts/discord_notify.py

      - name: Send email if new rows found
        if: ${{ steps.parse.outputs.total != '0' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.parse.outputs.subject }}
          to: ${{ secrets.MAIL_TO }}
          from: Internship Watcher
          html_body: ${{ steps.parse.outputs.html_body }}
          body: ${{ steps.parse.outputs.plain_body }}

      - name: Save new snapshots for next run
        run: |
          cp current-summer.md snapshots/previous-summer.md
          cp current-offseason.md snapshots/previous-offseason.md
          cp current-newgrad.md snapshots/previous-newgrad.md
          cp current-vansh.md snapshots/previous-vansh.md
          cp current-vansh-off.md snapshots/previous-vansh-off.md
          cp current-applyguy.json snapshots/previous-applyguy.json
          cp current-vansh-ng.md snapshots/previous-vansh-ng.md
          cp current-zshah.json snapshots/previous-zshah.json
          cp current-ambicuity.json snapshots/previous-ambicuity.json
          cp current-speedy-swe.md snapshots/previous-speedy-swe.md
          cp current-speedy-ai.md snapshots/previous-speedy-ai.md
          cp current-aprameyak.md snapshots/previous-aprameyak.md
          cp current-summer.md snapshots/previous-main.md

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add snapshots/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update board snapshots"
          git pull --rebase origin main
          git push
