name: ATS Board Watcher

on:
  # Hourly backup, offset from the board watcher. cron-job.org is the fast path (every 5 min).
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [iw-cron-ats]

permissions:
  contents: write
  issues: write

concurrency:
  group: ats-watcher
  cancel-in-progress: false

jobs:
  check-ats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAIL_TO: ${{ secrets.MAIL_TO }}
      ENABLE_EMAIL: ${{ vars.ENABLE_EMAIL }}
      ENABLE_GITHUB_ISSUES: ${{ vars.ENABLE_GITHUB_ISSUES }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Poll ATS boards and build email
        id: parse
        run: python3 .github/workflow-scripts/ats_watcher.py

      - name: Open GitHub issue if new roles found
        if: ${{ steps.parse.outputs.total != '0' && env.ENABLE_GITHUB_ISSUES == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ steps.parse.outputs.subject }}
        run: |
          gh issue create --title "$ISSUE_TITLE" --body-file alert.md --label "new-listing"

      - name: Ping Discord if new roles found
        if: ${{ steps.parse.outputs.total != '0' }}
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 .github/workflow-scripts/discord_notify.py

      - name: Send email if new roles found
        if: ${{ steps.parse.outputs.total != '0' && env.ENABLE_EMAIL == 'true' && env.MAIL_TO != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.parse.outputs.subject }}
          to: ${{ secrets.MAIL_TO }}
          from: Internship Watcher (ATS)
          html_body: ${{ steps.parse.outputs.html_body }}
          body: ${{ steps.parse.outputs.plain_body }}

      - name: Commit updated seen state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add snapshots/ats-seen.json snapshots/ats-watch-version.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update ATS seen state"
          git pull --rebase origin main
          git push
